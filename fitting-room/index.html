<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capsule Fitting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* One deliberate pastel dress-up-game look (single theme, painted explicitly) */
  :root {
    color-scheme: light;
    --frame: #8f88e6;      /* periwinkle window */
    --frame-dk: #5d56b9;   /* outlines, tags */
    --panel: #fce9ee;      /* blush cards */
    --panel-2: #fff6f8;
    --ink: #3d3780;
    --muted: #7a74c4;
    --pink: #f0879c;       /* selection marker, size fill */
    --pink-lt: #f9c3cd;
    --lilac: #c3bdf5;      /* sparkles, cloud lines */
    --stage-bg: #fce9ee;
    --pixel: "Pixelify Sans", "Courier New", monospace;
    --round: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #e9e6fb; color: var(--ink); font: 15px/1.45 var(--round); }
  img { max-width: 100%; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

  .page { min-height: 100%; box-sizing: border-box; padding: 16px; display: grid; place-items: center; }
  .window {
    width: min(1120px, 100%); background: var(--frame); border: 3px solid var(--frame-dk); border-radius: 18px;
    box-shadow: 0 6px 0 var(--frame-dk), 0 20px 40px rgba(61, 55, 128, .18); overflow: hidden;
  }
  .titlebar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px 4px; color: #fff; }
  .titlebar h1 { margin: 0; font: 600 18px var(--pixel); letter-spacing: .04em; }
  .winbtns { display: flex; gap: 5px; }
  .winbtns i { width: 13px; height: 13px; border: 2px solid var(--frame-dk); background: var(--panel-2); border-radius: 3px; }
  .body { display: grid; grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.25fr); gap: 14px; padding: 10px 14px 16px; }

  /* ---------- left: character ---------- */
  .left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .swatches {
    align-self: flex-start; display: flex; gap: 8px; padding: 8px 10px; background: var(--panel-2);
    border: 3px solid var(--frame-dk); border-radius: 10px; position: relative;
  }
  .swatches::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 7px solid transparent; border-top-color: var(--pink); transform: translateX(-50%); display: none; }
  .sw { width: 30px; height: 26px; border-radius: 6px; border: 2px solid var(--frame-dk); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--pink); }
  .stage {
    position: relative; flex: 1; min-height: 520px; background: var(--stage-bg); border: 3px solid var(--frame-dk);
    border-radius: 12px; overflow: hidden; transition: background-color .3s;
  }
  .clouds { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .spinbtn {
    position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--frame-dk);
    background: var(--panel-2); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .spinbtn svg { width: 20px; height: 20px; }
  .spinbtn[aria-pressed="true"] { background: var(--frame-dk); color: #fff; }
  .spinbtn[aria-pressed="true"] svg { animation: turn 2.4s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .status {
    position: absolute; top: 14px; left: 12px; font: 400 13px var(--pixel); background: var(--panel-2);
    border: 2px solid var(--frame-dk); border-radius: 8px; padding: 3px 9px;
  }
  .status.err { color: #b3324a; }
  .caption {
    position: absolute; left: 10px; right: 10px; bottom: 10px; text-align: center; font: 700 13px var(--round);
    background: rgba(255, 246, 248, .88); border: 2px solid var(--frame-dk); border-radius: 10px; padding: 5px 10px;
  }

  /* ---------- right: wardrobe cards ---------- */
  .right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card {
    position: relative; background: var(--panel); border: 3px solid var(--frame-dk); border-radius: 10px;
    padding: 24px 16px 18px; margin-top: 10px;
  }
  .tag {
    position: absolute; top: -13px; left: 14px; background: var(--frame-dk); color: #fff; font: 400 14px var(--pixel);
    padding: 1px 34px 2px 10px; border-radius: 6px 6px 0 0; letter-spacing: .03em;
  }
  .spark { position: absolute; color: var(--lilac); font-size: 13px; line-height: 1; pointer-events: none; }
  .items { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
  .item {
    position: relative; width: 104px; background: none; border: 0; padding: 4px 4px 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .item .pic { width: 92px; height: 92px; display: grid; place-items: center; transition: transform .18s; }
  .item img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .item .lbl { font: 700 12px/1.2 var(--round); color: var(--muted); text-align: center; }
  .item:hover .pic { transform: translateY(-3px) rotate(-3deg); }
  .item[aria-pressed="true"] .lbl { color: var(--ink); }
  .item[aria-pressed="true"]::after {
    content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    border: 8px solid transparent; border-bottom: 11px solid var(--pink); border-top: 0;
  }
  .item[aria-pressed="true"] .pic { animation: pop .35s ease-out; }
  @keyframes pop { 40% { transform: scale(1.1); } }
  .none-ic { width: 54px; height: 54px; border: 3px dashed var(--lilac); border-radius: 50%; display: grid; place-items: center; color: var(--lilac); font: 600 22px var(--pixel); }

  /* size bar, like the reference's length slider */
  .sizebar { display: grid; gap: 8px; }
  .track { position: relative; height: 22px; background: var(--panel-2); border: 3px solid var(--frame-dk); border-radius: 6px; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--pink); transition: width .35s cubic-bezier(.3, 1.4, .5, 1); }
  .stops { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stop {
    text-align: left; background: var(--panel-2); border: 2px solid var(--lilac); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .stop b { font: 600 18px var(--pixel); margin-right: 6px; }
  .stop span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stop[aria-pressed="true"] { border-color: var(--frame-dk); box-shadow: inset 0 0 0 1px var(--frame-dk); }

  .views { display: flex; flex-wrap: wrap; gap: 10px; }
  .vbtn {
    background: var(--panel-2); border: 2px solid var(--frame-dk); border-radius: 8px; padding: 6px 14px; cursor: pointer;
    font: 400 14px var(--pixel); display: flex; align-items: center; gap: 6px;
  }
  .vbtn:hover { background: #fff; }

  @media (max-width: 820px) {
    .page { padding: 10px; place-items: start center; }
    .body { grid-template-columns: 1fr; }
    .stage { min-height: 0; height: 62svh; }
    .item { width: 88px; }
    .item .pic { width: 76px; height: 76px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinbtn[aria-pressed="true"] svg, .item[aria-pressed="true"] .pic { animation: none; }
    .fill { transition: none; }
  }
</style>

<div class="page">
  <div class="window">
    <div class="titlebar">
      <h1>fitting room</h1>
      <span class="winbtns" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <div class="body">
      <section class="left">
        <div class="swatches" id="swatches" role="group" aria-label="Backdrop colour"></div>
        <div class="stage" id="stage" aria-label="3D character. Drag to turn, scroll or pinch to zoom.">
          <svg class="clouds" id="clouds" aria-hidden="true" preserveAspectRatio="xMidYMid slice"></svg>
          <span class="status" id="status" role="status">loading…</span>
          <button class="spinbtn" id="spin" aria-pressed="true" aria-label="Turntable">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
          </button>
          <div class="caption" id="caption"></div>
        </div>
      </section>

      <section class="right">
        <div class="card">
          <span class="tag">size</span>
          <span class="spark" style="top:10px;right:18px" aria-hidden="true">✦</span>
          <div class="sizebar">
            <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
            <div class="stops" id="sizes"></div>
          </div>
        </div>
        <div class="card">
          <span class="tag">top</span>
          <span class="spark" style="top:12px;right:22px" aria-hidden="true">✦</span>
          <span class="spark" style="bottom:14px;right:40%" aria-hidden="true">✧</span>
          <div class="items" id="tops"></div>
        </div>
        <div class="card">
          <span class="tag">bottom</span>
          <span class="spark" style="top:12px;right:28px" aria-hidden="true">✧</span>
          <span class="spark" style="bottom:18px;right:16px" aria-hidden="true">✦</span>
          <div class="items" id="bottoms"></div>
        </div>
        <div class="card">
          <span class="tag">view</span>
          <div class="views">
            <button class="vbtn" id="front">◉ front</button>
            <button class="vbtn" id="side">◐ side</button>
            <button class="vbtn" id="back">○ back</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// where assets live (repo layout); the hosted preview swaps these two lines
const MODELS = (name) => `../models/${name}.glb`;
const IMAGES = (name) => `../store-mockup/img/${name}.webp`;

// ---- catalogue + fit (mirrors models/fit.json; Blender Z-up values) ----
const SIZES = {
  S: { file: MODELS("avatar_S"), garmentScale: [1, 1, 1], label: "bust 86 · waist 68 · hip 94" },
  L: { file: MODELS("avatar_L"), garmentScale: [1.15, 1.15, 1], label: "bust 99 · waist 78 · hip 108" },
};
const GARMENTS = {
  blue_moto_jacket: { slot: "top", name: "moto jacket", img: IMAGES("moto-jacket-royal-blue"),
    file: MODELS("blue_moto_jacket"), scale: [1.08, 1.08, 1.08], offset: [0, 0, 0.82], hides: ["torso_upper", "arms"] },
  burgundy_peplum_jacket: { slot: "top", name: "peplum · burgundy", img: IMAGES("peplum-jacket-burgundy"),
    file: MODELS("burgundy_peplum_jacket"), scale: [1.10, 1.10, 1.08], offset: [0, 0, 0.82], hides: ["torso_upper", "arms"] },
  beige_peplum_jacket: { slot: "top", name: "peplum · sand", img: IMAGES("peplum-jacket-sand"),
    file: MODELS("beige_peplum_jacket"), scale: [1.10, 1.10, 1.08], offset: [0, 0, 0.82], hides: ["torso_upper", "arms"] },
  green_balloon_pants: { slot: "bottom", name: "balloon trousers", img: IMAGES("balloon-trousers-olive"),
    file: MODELS("green_balloon_pants"), scale: [1.06, 1.06, 1.0], offset: [0, 0, 0.03], hides: ["hips", "legs"],
    tuck: { z0: 0.72, z1: 0.93, scale: 0.72 } },
};
const BACKDROPS = [["blush", "#fce9ee"], ["mint", "#e2f4ea"], ["butter", "#fff3d6"], ["sky", "#e3ecfb"]];
const PARTS = ["head", "torso_upper", "hips", "arms", "hands", "legs", "feet"];

const state = { size: "S", top: "blue_moto_jacket", bottom: "green_balloon_pants", backdrop: 0,
  spin: !matchMedia("(prefers-reduced-motion: reduce)").matches };

// ---- clouds: each cloud is outline circles under fill circles, so only the outer edge shows ----
function drawClouds() {
  const svg = document.getElementById("clouds");
  const W = 400, H = 640;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const clouds = [[-10, 110, 1.1], [300, 70, 0.8], [330, 250, 1.0], [-30, 330, 0.9], [310, 450, 1.2], [-20, 560, 1.1], [150, 30, 0.55], [230, 600, 0.7]];
  const blob = [[0, 0, 28], [30, -14, 34], [66, -4, 28], [92, 8, 22], [44, 14, 26], [14, 16, 20]];
  let outline = "", fill = "";
  for (const [x, y, s] of clouds) {
    for (const [dx, dy, r] of blob) {
      const c = `cx="${x + dx * s}" cy="${y + dy * s}" r="${r * s}"`;
      outline += `<circle ${c}/>`;
      fill += `<circle ${c}/>`;
    }
  }
  svg.innerHTML = `<g fill="none" stroke="#c3bdf5" stroke-width="7">${outline}</g><g fill="#ffffff" fill-opacity=".9">${fill}</g>`;
}
drawClouds();

// ---- three setup ----
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement, document.getElementById("status"));
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const key = new THREE.DirectionalLight(0xfff4f6, 1.3);
key.position.set(1.6, 3.2, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -1, right: 1, top: 2, bottom: -0.2, near: 0.5, far: 8 });
key.shadow.bias = -0.0005;
scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.7, 48), new THREE.ShadowMaterial({ color: 0x5d56b9, opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const figure = new THREE.Group();
scene.add(figure);
const camera = new THREE.PerspectiveCamera(27, 0.6, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, enablePan: false, minDistance: 1.4, maxDistance: 6.5,
  minPolarAngle: 0.35, maxPolarAngle: 1.75, autoRotateSpeed: 1.6 });
function frame(az) {
  const aspect = camera.aspect || 0.6;
  const d = aspect < 0.7 ? 5.2 : 4.5;           // step back on tall, narrow stages so the whole figure fits
  camera.position.set(Math.sin(az) * d, 1.0, Math.cos(az) * d);
  controls.target.set(0, 0.88, 0);
  controls.update();
}
new ResizeObserver(() => {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}).observe(stage);
requestAnimationFrame(() => frame(0.35));
renderer.setAnimationLoop(() => {
  controls.autoRotate = state.spin;
  controls.update();
  renderer.render(scene, camera);
});
controls.addEventListener("start", () => setSpin(false));

// ---- loading (.glb directly, or base64 text where the host doesn't serve .glb) ----
const loader = new GLTFLoader();
const cache = new Map();
function load(file) {
  if (!cache.has(file)) {
    const gltfP = file.endsWith(".b64.txt")
      ? fetch(file).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }).then((txt) => {
          const raw = atob(txt.trim());
          const bytes = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
          return loader.parseAsync(bytes.buffer, "");
        })
      : loader.loadAsync(file);
    const p = gltfP.then((gltf) => {
      gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      return gltf.scene;
    });
    p.catch(() => cache.delete(file));
    cache.set(file, p);
  }
  return cache.get(file);
}
const tuckData = new WeakMap();
function setTuck(root, t, on) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    if (!tuckData.has(o)) {
      const orig = pos.array.slice(), tucked = orig.slice();
      for (let i = 0; i < tucked.length; i += 3) {
        let u = Math.min(1, Math.max(0, (orig[i + 1] - t.z0) / (t.z1 - t.z0)));
        u = u * u * (3 - 2 * u);
        const k = 1 + (t.scale - 1) * u;
        tucked[i] = orig[i] * k; tucked[i + 2] = orig[i + 2] * k;
      }
      tuckData.set(o, { orig, tucked, on: false });
    }
    const d = tuckData.get(o);
    if (d.on !== on) { pos.array.set(on ? d.tucked : d.orig); pos.needsUpdate = true; o.geometry.computeBoundingSphere(); d.on = on; }
  });
}

const statusEl = document.getElementById("status");
function status(msg, err = false) { statusEl.hidden = !msg; statusEl.textContent = msg || ""; statusEl.classList.toggle("err", err); }

let ticket = 0;
async function dress() {
  const t = ++ticket;
  renderUI();
  const worn = [state.top, state.bottom].filter(Boolean);
  const files = [SIZES[state.size].file, ...worn.map((k) => GARMENTS[k].file)];
  if (files.some((f) => !cache.has(f))) status("loading…");
  let objs;
  try { objs = await Promise.all(files.map(load)); }
  catch { if (t === ticket) status("couldn't load · tap it again", true); return; }
  if (t !== ticket) return;
  const [avatar, ...gs] = objs;
  figure.clear();
  const hidden = new Set(worn.flatMap((k) => GARMENTS[k].hides));
  for (const part of PARTS) { const o = avatar.getObjectByName(part); if (o) o.visible = !hidden.has(part); }
  figure.add(avatar);
  const g = SIZES[state.size].garmentScale;
  worn.forEach((k, i) => {
    const spec = GARMENTS[k], root = gs[i];
    const s = spec.scale.map((v, j) => v * g[j]);
    root.scale.set(s[0], s[2], s[1]);                           // Blender z-up -> three y-up
    root.position.set(spec.offset[0], spec.offset[2], -spec.offset[1]);
    if (spec.tuck) setTuck(root, spec.tuck, Boolean(state.top));
    figure.add(root);
  });
  status("");
  preloadRest();
}
let preloading = false;
async function preloadRest() {
  if (preloading) return;
  preloading = true;
  for (const f of [...Object.values(GARMENTS).map((x) => x.file), SIZES.L.file]) { try { await load(f); } catch {} }
}

// ---- UI ----
const $ = (id) => document.getElementById(id);
function button(cls, html, pressed, onClick, label) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.innerHTML = html;
  b.setAttribute("aria-pressed", String(pressed));
  if (label) b.setAttribute("aria-label", label);
  b.addEventListener("click", onClick);
  return b;
}
function renderUI() {
  $("swatches").replaceChildren(...BACKDROPS.map(([name, hex], i) => {
    const b = button("sw", "", state.backdrop === i, () => { state.backdrop = i; renderUI(); }, `${name} backdrop`);
    b.style.background = hex;
    return b;
  }));
  stage.style.setProperty("--stage-bg", BACKDROPS[state.backdrop][1]);

  $("fill").style.width = state.size === "S" ? "38%" : "100%";
  $("sizes").replaceChildren(...Object.entries(SIZES).map(([k, s]) =>
    button("stop", `<b>${k}</b><span>${s.label}</span>`, state.size === k, () => { state.size = k; dress(); })));

  for (const slot of ["top", "bottom"]) {
    const items = Object.entries(GARMENTS).filter(([, g]) => g.slot === slot).map(([k, g]) =>
      button("item", `<span class="pic"><img src="${g.img}" alt=""></span><span class="lbl">${g.name}</span>`,
        state[slot] === k, () => { state[slot] = state[slot] === k ? null : k; dress(); }, g.name));
    items.push(button("item", `<span class="pic"><span class="none-ic">×</span></span><span class="lbl">none</span>`,
      !state[slot], () => { state[slot] = null; dress(); }, `no ${slot}`));
    $(slot === "top" ? "tops" : "bottoms").replaceChildren(...items);
  }
  const worn = [state.top, state.bottom].filter(Boolean).map((k) => GARMENTS[k].name);
  $("caption").textContent = `size ${state.size} · ${worn.length ? worn.join(" + ") : "just the mannequin"}`;
}
function setSpin(on) { state.spin = on; $("spin").setAttribute("aria-pressed", String(on)); }
$("spin").addEventListener("click", () => setSpin(!state.spin));
$("front").addEventListener("click", () => { setSpin(false); frame(0); });
$("side").addEventListener("click", () => { setSpin(false); frame(Math.PI / 2); });
$("back").addEventListener("click", () => { setSpin(false); frame(Math.PI); });
setSpin(state.spin);
dress();
</script>
