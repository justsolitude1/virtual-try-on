<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Try-On</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Figtree:wght@400;600&display=swap">
<style>
  :root { --bg: #eceef1; --ink: #16171a; --muted: #5d6370; --card: #fff; --line: #d4d8de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111214; --ink: #eceef1; --muted: #9aa1ac; --card: #1b1d21; --line: #2d3036; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Figtree", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px; }
  h1 { font: 500 40px/1.1 "Bodoni Moda", Georgia, serif; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--ink); }
  a.card b { display: block; font: 500 22px "Bodoni Moda", Georgia, serif; margin-bottom: 4px; }
  a.card span { color: var(--muted); font-size: 14px; }
</style>
<main>
  <h1>Virtual Try-On</h1>
  <p>Four garments on S and L mannequins, rendered live in the browser with three.js.</p>
  <div class="cards">
    <a class="card" href="fitting-room/"><b>Fitting Room</b><span>Pick a size, layer a jacket over the trousers, rotate 360°.</span></a>
    <a class="card" href="store-mockup/"><b>Store Mockup</b><span>The same try-on inside a Shopify-style product page.</span></a>
  </div>
</main>
